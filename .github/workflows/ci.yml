name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  cancel-in-progress: true
  group: ci-${{ github.ref }}

permissions:
  contents: read

env:
  DATABASE_PASSWORD: &database-password postgres
  DATABASE_USER: &database-user postgres
  REDIS_PASSWORD: redis

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    services: &services
      postgres:
        env:
          POSTGRES_PASSWORD: *database-password
          POSTGRES_USER: *database-user
        image: postgres:18
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    steps:
      - &checkout
        name: Check out the repository
        uses: actions/checkout@v7

      - &install-tools
        name: Install the pinned tools
        uses: jdx/mise-action@v5

      - &restore-gems
        name: Restore the gems
        uses: actions/cache@v6
        with:
          key: gems-${{ runner.os }}-${{ hashFiles('Gemfile.lock', '.config/mise.lock') }}
          path: ${{ runner.temp }}/gems
          restore-keys: gems-${{ runner.os }}-

      - &install-dependencies
        name: Install the dependencies
        run: |
          export GEM_HOME="$RUNNER_TEMP/gems"
          echo "GEM_HOME=$GEM_HOME" >>"$GITHUB_ENV"
          echo "$GEM_HOME/bin" >>"$GITHUB_PATH"
          mise run setup:dependencies

      - &install-postgres-client
        name: Install the Postgres 18 client
        run: |
          key=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo install -d "$(dirname "$key")"
          sudo curl -fsSL -o "$key" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=$key] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes postgresql-client-18
          echo /usr/lib/postgresql/18/bin >>"$GITHUB_PATH"

      - name: Fetch the tags the schema check builds from
        run: git fetch --depth=1 origin '+refs/tags/*:refs/tags/*'

      - name: Check the schema dump matches the migrations
        run: mise run db:check

      - name: Lint
        run: mise run lint

  features:
    name: Features
    runs-on: ubuntu-latest
    services: *services
    steps:
      - *checkout
      - *install-tools
      - *restore-gems
      - *install-dependencies
      - *install-postgres-client

      - name: Restore the Playwright browser
        uses: actions/cache@v6
        with:
          key: playwright-${{ runner.os }}-${{ hashFiles('aube-lock.yaml') }}
          path: ~/.cache/ms-playwright
          restore-keys: playwright-${{ runner.os }}-

      - name: Install the Playwright browser
        run: aube --dir features exec playwright install --with-deps chromium

      - name: Install xmllint and the vips tools
        run: sudo apt-get install --no-install-recommends --yes libxml2-utils libvips-tools

      - name: Test
        run: mise run test

      - name: Keep the failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: features-results
          path: |-
            features/test-results
            tmp/features-*.log
