  path_style: <%= ENV["MEDIA_STORE_PATH_STYLE"].to_json %>
  region: <%= ENV["MEDIA_STORE_REGION"].to_json %>
  secret_key: <%= ENV["MEDIA_STORE_SECRET_KEY"].to_json %>
owner:
  github_id: <%= ENV.fetch("OWNER_GITHUB_ID", 931094) %>
  name: Aaron Allen
page_size:
  admin: 100
  mcp: 100
  public: 25
web_threads: <%= ENV["HANAMI_MAX_THREADS"].to_json %>
webmentions:
  throttle_limit: <%= ENV["WEBMENTIONS_THROTTLE_LIMIT"].to_json %>
  throttle_window_minutes: <%= ENV["WEBMENTIONS_THROTTLE_WINDOW_MINUTES"].to_json %>
  total_throttle_limit: <%= ENV["WEBMENTIONS_TOTAL_THROTTLE_LIMIT"].to_json %>
