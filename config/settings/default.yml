analytics:
  throttle_limit: <%= ENV["ANALYTICS_THROTTLE_LIMIT"].to_json %>
  throttle_window_minutes: <%= ENV["ANALYTICS_THROTTLE_WINDOW_MINUTES"].to_json %>
attention:
  carried_count: 3
  draft_days: 30
  journal_days: 2
  new_device_days: 7
  someday_days: 90
backup_store:
  access_key: <%= ENV["BACKUP_STORE_ACCESS_KEY"].to_json %>
  bucket: <%= ENV["BACKUP_STORE_BUCKET"].to_json %>
  endpoint: <%= ENV["BACKUP_STORE_ENDPOINT"].to_json %>
  path_style: <%= ENV["BACKUP_STORE_PATH_STYLE"].to_json %>
  region: <%= ENV["BACKUP_STORE_REGION"].to_json %>
  secret_key: <%= ENV["BACKUP_STORE_SECRET_KEY"].to_json %>
bluesky:
  app_password: <%= ENV["BLUESKY_APP_PASSWORD"].to_json %>
  handle: aaronmallen.dev
  profile_url: https://bsky.app/profile/aaronmallen.dev
client_registration:
  throttle_limit: <%= ENV["CLIENT_REGISTRATION_THROTTLE_LIMIT"].to_json %>
  throttle_window_minutes: <%= ENV["CLIENT_REGISTRATION_THROTTLE_WINDOW_MINUTES"].to_json %>
  total_throttle_limit: <%= ENV["CLIENT_REGISTRATION_TOTAL_THROTTLE_LIMIT"].to_json %>
contact:
  minimum_submit_seconds: <%= ENV["CONTACT_MINIMUM_SUBMIT_SECONDS"].to_json %>
  stamp_expiry_hours: <%= ENV["CONTACT_STAMP_EXPIRY_HOURS"].to_json %>
  throttle_limit: <%= ENV["CONTACT_THROTTLE_LIMIT"].to_json %>
  throttle_window_minutes: <%= ENV["CONTACT_THROTTLE_WINDOW_MINUTES"].to_json %>
  total_throttle_limit: <%= ENV["CONTACT_TOTAL_THROTTLE_LIMIT"].to_json %>
github:
  api_token: <%= ENV["GITHUB_API_TOKEN"].to_json %>
  client_id: <%= ENV["GITHUB_CLIENT_ID"].to_json %>
  client_secret: <%= ENV["GITHUB_CLIENT_SECRET"].to_json %>
  profile_url: https://github.com/aaronmallen
honeybadger:
  api_key: <%= ENV["HONEYBADGER_API_KEY"].to_json %>
  project_url: <%= ENV["HONEYBADGER_PROJECT_URL"].to_json %>
  report_data: <%= ENV["HONEYBADGER_REPORT_DATA"].to_json %>
linear:
  api_keys: <%= ENV["LINEAR_API_KEYS"].to_json %>
mastodon:
  access_token: <%= ENV["MASTODON_ACCESS_TOKEN"].to_json %>
  profile_url: https://ruby.social/@aaronmallen
  url: https://ruby.social
maxmind:
  account_id: <%= ENV["MAXMIND_ACCOUNT_ID"].to_json %>
  license_key: <%= ENV["MAXMIND_LICENSE_KEY"].to_json %>
media_store:
  access_key: <%= ENV["MEDIA_STORE_ACCESS_KEY"].to_json %>
  bucket: <%= ENV["MEDIA_STORE_BUCKET"].to_json %>
