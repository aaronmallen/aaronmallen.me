analytics_salt: development-analytics-salt-not-a-real-secret-do-not-use-this-in-production
app_secret: development-app-secret-not-a-real-secret-do-not-use-this-in-production
data_key: development-data-key-not-a-real-secret-do-not-use-this-in-production
reader_salt: development-reader-salt-not-a-real-secret-do-not-use-this-in-production
database:
  host: localhost
  name: <%= ENV.fetch("DATABASE_NAME", "blog_development").to_json %>
media_store: &local_store
  access_key: <%= ENV["MEDIA_STORE_ACCESS_KEY"].to_json %>
  bucket: blog-development
  endpoint: <%= "http://localhost:#{ENV.fetch("MEDIA_STORE_PORT", 9000)}".to_json %>
  path_style: true
  read_timeout: null
  region: null
  secret_key: <%= ENV["MEDIA_STORE_SECRET_KEY"].to_json %>
redis:
  db: 1
  host: localhost
share_site:
  url: http://shares.localhost:2300
share_store:
  !!merge <<: *local_store
  bucket: shares-development
site:
  url: http://localhost:2300
