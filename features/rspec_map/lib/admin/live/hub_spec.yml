- example: "Admin::Live::Hub answers each stream as an event stream that retries"
  scenario: "db/live.feature: The admin event stream answers as an event stream that retries"
- example: "Admin::Live::Hub drops a stream that cannot take a write without blocking"
  drop: "socket handling inside the hub: no outside step can make a reader block or vanish and then read the hub's list of streams"
- example: "Admin::Live::Hub drops a stream whose reader went away"
  drop: "socket handling inside the hub: no outside step can make a reader block or vanish and then read the hub's list of streams"
- example: "Admin::Live::Hub reports a dropped connection"
  drop: "Honeybadger has no API key in test, so whether it builds, halts or sends a notice never leaves the process"
- example: "Admin::Live::Hub sends a change to every open stream"
  scenario: "db/live.feature: Every open admin event stream hears a change to an admin table"
- example: "Admin::Live::Hub stamps each change with the hub's clock"
  drop: "the stamp is the hub's own clock, with nothing outside the process to compare it to"
- example: "Admin::Live::Hub tells each stream to catch up when its own connection comes back"
  scenario: "db/live.feature: An admin event stream catches up when the hub's database connection comes back"
- example: "Admin::Live::Hub with nothing changing sends a heartbeat"
  drop: "the heartbeat comes every 30 seconds, and a scenario that waits that long costs more than it guards"
- example: "Admin::Live::Hub with several notices in one tick sends one event per table"
  drop: "batching needs several notices inside one second-long tick, which a step cannot pin; Postgres also folds equal notices sent in one transaction"
