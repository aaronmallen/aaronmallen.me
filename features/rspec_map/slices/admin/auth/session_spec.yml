- example: "Admin::Auth::Session answers signed in after signing in within the same request"
  scenario: "admin/sign_in.feature: Signing in from the sign-in page opens the admin"
- example: "Admin::Auth::Session answers signed out after signing out within the same request"
  scenario: "admin/sign_in.feature: Signing out sends me home and ends the session"
- example: "Admin::Auth::Session keeps a session that began after its device was signed out"
  scenario: "admin/sign_in.feature: A device signed out from the security tab signs in again as the same device"
- example: "Admin::Auth::Session keeps the device in the session"
  scenario: "admin/sign_in.feature: Signing in sets a device cookie for the new device"
- example: "Admin::Auth::Session refuses a session that began when its device was signed out"
  scenario: "admin/sign_in.feature: Signing out a device from the security tab ends only its session"
- example: "Admin::Auth::Session refuses a session that names no device"
  drop: "every sign-in through the app names a device, so no request can carry a session without one; the device features cover a session whose device is gone"
- example: "Admin::Auth::Session refuses a session whose device is gone"
  scenario: "admin/sign_in.feature: A session whose device is gone asks for sign-in again"
