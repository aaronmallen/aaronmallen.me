- example: "API publishing a post POST /api/v1/posts/:id/publish answers 404 for a post that isn't there"
  scenario: "post_api/edit_notes_and_publish.feature: Publishing a post that is not there answers 404"
- example: "API publishing a post POST /api/v1/posts/:id/publish answers 500 when the publish fails some other way"
  drop: "swaps the operation for a double that fails; no HTTP request can make it fail"
- example: "API publishing a post POST /api/v1/posts/:id/publish publishes a draft now and answers it"
  scenario: "post_api/edit_notes_and_publish.feature: Publishing a draft makes it live now"
- example: "API publishing a post POST /api/v1/posts/:id/publish publishes a scheduled post now"
  scenario: "post_api/edit_notes_and_publish.feature: Publishing a scheduled post makes it live now"
- example: "API publishing a post POST /api/v1/posts/:id/publish refuses a post already published and leaves it as it was"
  scenario: "post_api/edit_notes_and_publish.feature: Publishing a post already live is refused, changes nothing and sends no second webmention pass"
- example: "API publishing a post POST /api/v1/posts/:id/publish refuses a post that fails the editor's checks and leaves it a draft"
  scenario: "post_api/edit_notes_and_publish.feature: Publishing a post that fails the editor's checks leaves it a draft"
- example: "API publishing a post POST /api/v1/posts/:id/publish schedules a draft whose publish time is still to come"
  scenario: "post_api/edit_notes_and_publish.feature: Publishing a draft with a time still to come schedules it"
- example: "API publishing a post POST /api/v1/posts/:id/publish sends no second webmention pass for a post already published"
  scenario: "post_api/edit_notes_and_publish.feature: Publishing a post already live is refused, changes nothing and sends no second webmention pass"
- example: "API publishing a post the MCP tool publishes as publish_post does"
  scenario: "post_api/edit_notes_and_publish.feature: publish_post answers and refuses as the endpoint does"
