- example: "API suggestions GET /api/v1/suggestions answers the same JSON as list_suggestions"
  scenario: "suggestions/suggestions_api.feature: The API lists the same suggestions as the MCP tool"
- example: "API suggestions GET /api/v1/suggestions lists the sets made in the range with every edit, settled ones too"
  scenario: "suggestions/suggestions_api.feature: The API lists the sets made in a range, settled edits too"
- example: "API suggestions POST /api/v1/suggestions answers a post that does not exist with a 404"
  scenario: "suggestions/suggestions_api.feature: A suggestion on a post that does not exist answers 404"
- example: "API suggestions POST /api/v1/suggestions needs a token with the suggest scope"
  scenario: "suggestions/suggestions_api.feature: A token without the suggest scope cannot suggest"
- example: "API suggestions POST /api/v1/suggestions on a social post holds the social post while it replaces the edits"
  drop: "probes a row lock from a second database connection mid-request; no HTTP client can see it"
- example: "API suggestions POST /api/v1/suggestions on a social post refuses an edit on a part the post lacks with a 422 naming the part"
  scenario: "suggestions/suggestions_api.feature: A suggestion on a part a social post lacks is refused"
- example: "API suggestions POST /api/v1/suggestions on a social post refuses with a 404 and stores nothing when the post sends before the lock"
  drop: "swaps an app component to time a race between two writers; no HTTP client can time it"
- example: "API suggestions POST /api/v1/suggestions on a social post stores an edit on the part it names"
  scenario: "suggestions/suggestions_api.feature: A suggestion on a social post names its part"
- example: "API suggestions POST /api/v1/suggestions refuses a published post with a 422"
  scenario: "suggestions/suggestions_api.feature: A suggestion on a published post is refused"
- example: "API suggestions POST /api/v1/suggestions refuses an empty set with a 422"
  scenario: "suggestions/suggestions_api.feature: A suggestion with no edits is refused"
- example: "API suggestions POST /api/v1/suggestions stores the edits as pending with a 201"
  scenario: "suggestions/suggestions_api.feature: A suggestion on a draft post is stored as pending"
- example: "API suggestions POST /api/v1/suggestions/:suggestion_id/accept answers an unknown suggestion with a 404"
  scenario: "suggestions/suggestions_api.feature: Accepting an unknown suggestion answers 404"
- example: "API suggestions POST /api/v1/suggestions/:suggestion_id/accept answers the edits it accepted with a 200"
  scenario: "suggestions/suggestions_api.feature: Accepting writes every pending edit and says which it took"
- example: "API suggestions POST /api/v1/suggestions/:suggestion_id/accept writes every pending edit into the post"
  scenario: "suggestions/suggestions_api.feature: Accepting writes every pending edit and says which it took"
- example: "API suggestions POST /api/v1/suggestions/:suggestion_id/reject refuses a set with nothing open with a 422"
  scenario: "suggestions/suggestions_api.feature: Rejecting a set with nothing open is refused"
- example: "API suggestions POST /api/v1/suggestions/:suggestion_id/reject rejects every open edit and leaves the post alone"
  scenario: "suggestions/suggestions_api.feature: Rejecting rejects every open edit and leaves the post alone"
