- example: "API projects GET /api/v1/projects answers the same JSON as list_projects"
- example: "API projects GET /api/v1/projects lists live projects, then archived ones, with a 200"
- example: "API projects PATCH /api/v1/projects/:id keeps every field the change leaves out"
- example: "API projects POST /api/v1/projects adds an active project with a 201"
- example: "API projects POST /api/v1/projects fills in the new project's stars"
- example: "API projects POST /api/v1/projects refuses a project with no visibility with a 422"
- example: "API projects POST /api/v1/projects/:id/archive archives the project as of today"
- example: "API projects POST /api/v1/projects/:id/archive refuses a project whose start month has not come with a 422"
- example: "API projects POST /api/v1/projects/:id/archive refuses an archived project with a 422 and keeps its archive day"
- example: "API projects POST /api/v1/projects/:id/restore answers a project that is not archived with a 404"
- example: "API projects POST /api/v1/projects/:id/restore restores an archived project as active"
