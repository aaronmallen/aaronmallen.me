- example: "API blog posts DELETE /api/v1/posts/:id deletes the post for good"
  scenario: "post_api/posts.feature: A delete removes the post in the path for good"
- example: "API blog posts DELETE /api/v1/posts/:id deletes the post in the path when the body names another ID"
  scenario: "post_api/posts.feature: A delete removes the post in the path for good"
- example: "API blog posts GET /api/v1/posts answers the same JSON as list_posts"
  scenario: "post_api/posts.feature: The list answers as list_posts does"
- example: "API blog posts GET /api/v1/posts keeps only the blog posts in the status asked for"
  scenario: "post_api/posts.feature: The list gives each post's figures and keeps the status asked for"
- example: "API blog posts GET /api/v1/posts lists the blog posts with their figures and the unsent social posts"
  scenario: "post_api/posts.feature: The list gives each post's figures and keeps the status asked for"
- example: "API blog posts GET /api/v1/posts refuses a day it cannot read with a 422"
  scenario: "post_api/posts.feature: The list refuses a day it cannot read"
- example: "API blog posts GET /api/v1/posts/:id/announcement composes the announcement without sending it"
  scenario: "post_api/posts.feature: The announcement is composed without being sent"
- example: "API blog posts PATCH /api/v1/posts/:id changes the fields it was given and keeps the rest"
  scenario: "post_api/posts.feature: A change touches only the fields it names, on the post in the path"
- example: "API blog posts PATCH /api/v1/posts/:id changes the post in the path when the body names another ID"
  scenario: "post_api/posts.feature: A change touches only the fields it names, on the post in the path"
- example: "API blog posts PATCH /api/v1/posts/:id refuses a past publish time on a scheduled post with a 422"
  scenario: "post_api/posts.feature: A scheduled post refuses a publish time in the past"
- example: "API blog posts PATCH /api/v1/posts/:id/seo refuses an image link that is not a URL with a 422"
  scenario: "post_api/posts.feature: The social card fields change and the answer gives what the post carries"
- example: "API blog posts PATCH /api/v1/posts/:id/seo sets the social card fields and answers what the post carries"
  scenario: "post_api/posts.feature: The social card fields change and the answer gives what the post carries"
- example: "API blog posts POST /api/v1/posts refuses a slug it cannot take with a 422"
  scenario: "post_api/posts.feature: A new post refuses a slug it cannot take"
- example: "API blog posts POST /api/v1/posts writes a draft with a 201"
  scenario: "post_api/posts.feature: A new post is a draft"
