- example: "API reading a post GET /api/v1/posts/:id answers 404 for a post that isn't there"
  scenario: "post_api/post_read.feature: A post that is not there answers 404, and read_post says the same"
- example: "API reading a post GET /api/v1/posts/:id answers every field the admin editor shows"
  scenario: "post_api/post_read.feature: The post answers every field the editor shows"
- example: "API reading a post GET /api/v1/posts/:id counts the webmentions the post has received"
  scenario: "post_api/post_read.feature: The post counts its webmentions and gives its edit notes newest first"
- example: "API reading a post GET /api/v1/posts/:id gives a null suggestion_id once every edit is settled"
  scenario: "post_api/post_read.feature: A suggestion with every edit settled leaves suggestion_id null"
- example: "API reading a post GET /api/v1/posts/:id gives empty text and null card fields for a post that leaves them blank"
  scenario: "post_api/post_read.feature: A post that leaves fields blank gives empty text and null card fields"
- example: "API reading a post GET /api/v1/posts/:id gives the edit notes newest first"
  scenario: "post_api/post_read.feature: The post counts its webmentions and gives its edit notes newest first"
- example: "API reading a post GET /api/v1/posts/:id gives the records linked to the post, grouped by kind"
  scenario: "post_api/post_read.feature: The post gives its linked records grouped by kind"
- example: "API reading a post GET /api/v1/posts/:id gives the suggested edits still open, and leaves out the settled ones"
  scenario: "post_api/post_read.feature: The post gives the open suggested edits and the suggestion that holds them"
- example: "API reading a post GET /api/v1/posts/:id gives the word count stored with the post"
  scenario: "post_api/post_read.feature: The post answers every field the editor shows"
- example: "API reading a post GET /api/v1/posts/:id names the suggestion that holds the open edits"
  scenario: "post_api/post_read.feature: The post gives the open suggested edits and the suggestion that holds them"
- example: "API reading a post the MCP tool answers as GET /api/v1/posts/:id does"
  scenario: "post_api/post_read.feature: read_post answers as the endpoint does"
- example: "API reading a post the MCP tool refuses an unknown ID with the message the endpoint gives"
  scenario: "post_api/post_read.feature: A post that is not there answers 404, and read_post says the same"
