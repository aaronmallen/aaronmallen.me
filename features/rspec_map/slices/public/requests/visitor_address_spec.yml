- example: "Visitor address with a connection that names no address trusts nothing, since there is nothing to match"
  drop: "Every connection a feature opens comes from a loopback address; no test client can open one that names none"
- example: "Visitor address with a connection the listener names in IPv6 matches the range the same, since it is the same address"
  drop: "The server listens on 127.0.0.1 only, so no feature can reach it over an IPv6-mapped address"
- example: "Visitor address with a header named in lower case reads the same header"
  drop: "The proxy's header name comes from committed production settings that no feature can change"
- example: "Visitor address with a range that holds the proxy takes the address the proxy wrote"
  scenario: "public/visitor_address.feature: In production the site takes the address the proxy wrote, the nearest one in a list"
- example: "Visitor address with no header named ignores an address the client asked for"
  scenario: "public/visitor_address.feature: Outside production the site takes the connection's address and ignores one the client names"
- example: "Visitor address with no header named takes the address the connection came from"
  scenario: "public/visitor_address.feature: Outside production the site takes the connection's address and ignores one the client names"
- example: "Visitor address with no proxy trusted ignores the header, since an unnamed proxy is no proxy"
  scenario: "public/visitor_address.feature: In production with <trusted> trusted, the site ignores the header a sender forged"
- example: "Visitor address with the connection outside every trusted range ignores the header a sender forged"
  scenario: "public/visitor_address.feature: In production with <trusted> trusted, the site ignores the header a sender forged"
- example: "Visitor address with the proxy's header named falls back to the connection when the header is blank"
  scenario: "public/visitor_address.feature: In production the site ignores the other headers a client sets and falls back to the connection"
- example: "Visitor address with the proxy's header named falls back to the connection when the proxy wrote nothing"
  scenario: "public/visitor_address.feature: In production the site ignores the other headers a client sets and falls back to the connection"
- example: "Visitor address with the proxy's header named ignores every other header the client sets"
  scenario: "public/visitor_address.feature: In production the site ignores the other headers a client sets and falls back to the connection"
- example: "Visitor address with the proxy's header named takes the address the proxy wrote"
  scenario: "public/visitor_address.feature: In production the site takes the address the proxy wrote, the nearest one in a list"
- example: "Visitor address with the proxy's header named takes the nearest address when the header carries a list"
  scenario: "public/visitor_address.feature: In production the site takes the address the proxy wrote, the nearest one in a list"
