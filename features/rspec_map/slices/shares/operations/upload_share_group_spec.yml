  scenario: "shares/share_group_page.feature: An image's preview serves a small copy, and the original when no copy is left"
- example: "Shares::Operations::UploadShareGroup with a store an image stores no preview for a file that is not an image"
  scenario: "shares/share_group_page.feature: An image's preview serves a small copy, and the original when no copy is left"
- example: "Shares::Operations::UploadShareGroup with a store calls a file sent with no type an octet stream"
  scenario: "shares/api.feature: An upload with no type is an octet stream, and a type in capitals is stored in lower case"
- example: "Shares::Operations::UploadShareGroup with a store deletes every stored file when an insert fails"
  drop: "needs a database insert to fail midway, which nothing outside can cause"
- example: "Shares::Operations::UploadShareGroup with a store deletes the previews too when an insert fails"
  drop: "needs a database insert to fail midway, which nothing outside can cause"
- example: "Shares::Operations::UploadShareGroup with a store keeps the upload with no preview when the store refuses the preview"
  scenario: "shares/api.feature: A group upload keeps an image whose preview the store refuses"
- example: "Shares::Operations::UploadShareGroup with a store refuses no files"
  scenario: "shares/api.feature: An empty group, a file that is not base64 and a blank name are refused"
- example: "Shares::Operations::UploadShareGroup with a store refuses the group when one file has no name and stores nothing"
  scenario: "shares/api.feature: An empty group, a file that is not base64 and a blank name are refused"
- example: "Shares::Operations::UploadShareGroup with a store saves no rows and keeps no files when the store fails on the second"
