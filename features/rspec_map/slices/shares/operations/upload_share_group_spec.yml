- example: "Shares::Operations::UploadShareGroup in Postgres lets one code hold one group"
  drop: "a database constraint behind the app's own checks, which nothing outside can reach"
- example: "Shares::Operations::UploadShareGroup refuses an upload with no store"
  drop: "features always run with a share store, so the store is never missing"
