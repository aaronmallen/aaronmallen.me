  scenario: "shares/api.feature: A new <what> skips to the next number when the code it would take is taken"
- example: "Shares::Operations::UploadShareGroup with a store two files keeps each file's name, type and size"
  scenario: "shares/api.feature: Uploading a group answers one link for the group and one for each file"
- example: "Shares::Operations::UploadShareGroup with a store two files makes one group under its short code id in base 36"
  scenario: "shares/api.feature: Uploading a group answers one link for the group and one for each file"
