- example: "Shares::Operations::UploadShare refuses an upload with no store"
  drop: "features always run with a share store, so the store is never missing"
- example: "Shares::Operations::UploadShare with a store calls a file sent with no type an octet stream"
  scenario: "shares/api.feature: An upload with no type is an octet stream, and a type in capitals is stored in lower case"
- example: "Shares::Operations::UploadShare with a store deletes the stored file when the insert fails"
  drop: "needs a database insert to fail midway, which nothing outside can cause"
- example: "Shares::Operations::UploadShare with a store keeps a JPEG's camera and GPS data"
  scenario: "shares/api.feature: A JPEG keeps its camera data and stays out of the photo store"
- example: "Shares::Operations::UploadShare with a store keeps the share out of the media bucket and the photos table"
  scenario: "shares/api.feature: A JPEG keeps its camera data and stays out of the photo store"
- example: "Shares::Operations::UploadShare with a store refuses a file with no name and stores nothing"
  scenario: "shares/api.feature: A blank file name is refused"
- example: "Shares::Operations::UploadShare with a store saves nothing when the store fails"
  scenario: "shares/api.feature: An upload the share store refuses answers 503 and keeps no row"
- example: "Shares::Operations::UploadShare with a store skips to the next id when the generated code is taken"
  scenario: "shares/api.feature: A new <what> skips to the next number when the code it would take is taken"
- example: "Shares::Operations::UploadShare with a store stores a PDF byte for byte under its short code id in base 36"
  scenario: "shares/api.feature: A <type> upload is stored byte for byte under its short code number in base 36"
- example: "Shares::Operations::UploadShare with a store stores a zip byte for byte under its short code id in base 36"
  scenario: "shares/api.feature: A <type> upload is stored byte for byte under its short code number in base 36"
- example: "Shares::Operations::UploadShare with a store stores an mp4 byte for byte under its short code id in base 36"
  scenario: "shares/api.feature: A <type> upload is stored byte for byte under its short code number in base 36"
