- example: "Shares::Jobs::FetchShortLinkTitle drops a title from a destination the link no longer points at"
  drop: "needs the link to move while its fetch is in flight, which the stub cannot hold open"
- example: "Shares::Jobs::FetchShortLinkTitle drops control characters and caps the length"
  scenario: "shares/short_link_jobs.feature: A fetched title loses its control characters and stops at 200 characters"
- example: "Shares::Jobs::FetchShortLinkTitle fetches nothing for a titled or missing link"
  scenario: "shares/short_link_jobs.feature: A titled link fetches no title, and a link that is gone fetches nothing"
- example: "Shares::Jobs::FetchShortLinkTitle keeps a title I typed while the fetch ran"
  drop: "needs a title typed while the fetch is in flight, which the stub cannot hold open"
- example: "Shares::Jobs::FetchShortLinkTitle leaves the title blank for a page that is not HTML"
  scenario: "shares/short_link_jobs.feature: A short link to a page that is not HTML gets no title"
- example: "Shares::Jobs::FetchShortLinkTitle leaves the title blank for a page with no title"
  scenario: "shares/short_link_jobs.feature: A short link to a page with no title gets none"
- example: "Shares::Jobs::FetchShortLinkTitle leaves the title blank for an error status"
  scenario: "shares/short_link_jobs.feature: A short link to an error page gets no title"
- example: "Shares::Jobs::FetchShortLinkTitle leaves the title blank when the page times out"
  drop: "needs a page that never answers, which the stub cannot do"
- example: "Shares::Jobs::FetchShortLinkTitle never fetches a private or local address"
  scenario: "shares/short_link_jobs.feature: The title fetch never asks a private address"
- example: "Shares::Jobs::FetchShortLinkTitle reads a page whose content type names HTML in capitals with a charset"
  drop: "needs a reply with a content type of its own, which the stub cannot set"
- example: "Shares::Jobs::FetchShortLinkTitle takes the og:title before the title"
  scenario: "shares/short_link_jobs.feature: A new short link takes the og:title before the title"
- example: "Shares::Jobs::FetchShortLinkTitle takes the title when there is no og:title"
  scenario: "shares/short_link_jobs.feature: A short link takes the title when the og:title is blank"
