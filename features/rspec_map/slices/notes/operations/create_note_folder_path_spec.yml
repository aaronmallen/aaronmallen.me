- example: "Notes::Operations::CreateNoteFolderPath answers no folder for an empty path"
  scenario: "notes/mcp.feature: The folder tools list, make, rename, move, describe and remove folders"
- example: "Notes::Operations::CreateNoteFolderPath answers the folder itself when the whole path exists"
  scenario: "notes/folders.feature: The settings move the folder inside another"
- example: "Notes::Operations::CreateNoteFolderPath makes each folder on a path, nested in the one before"
  scenario: "notes/tree.feature: I make a nested folder from the tree"
- example: "Notes::Operations::CreateNoteFolderPath makes nothing when a name on the path is refused"
  drop: "Every name the admin or MCP sends passes the folder name check, so no request reaches a refused name on a path"
- example: "Notes::Operations::CreateNoteFolderPath reuses the folders a path already names, whatever their case"
  scenario: "notes/folders.feature: The settings move the folder inside another"
