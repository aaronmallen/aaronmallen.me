- example: "Social::Operations::ExpandForNetwork counts a link I shortened before at its own code"
  scenario: "delivery/text.feature: A link I shortened before goes out at its own code"
- example: "Social::Operations::ExpandForNetwork expands each body in order"
  scenario: "delivery/text.feature: A thread's parts each go out with their links and mentions expanded, in order"
- example: "Social::Operations::ExpandForNetwork expands mentions to the network's handle"
  scenario: "social/composer.feature: The preview shows each network's handle or a plain name in place of a mention, part by part"
- example: "Social::Operations::ExpandForNetwork keeps the mention offsets after a link gets shorter"
  scenario: "delivery/text.feature: A mention after a link that went short is marked over the right bytes"
- example: "Social::Operations::ExpandForNetwork keeps the mention offsets for the text the network gets"
  scenario: "delivery/text.feature: Bluesky gets the Bluesky handle marked with the stored DID"
- example: "Social::Operations::ExpandForNetwork makes a short link when asked and queues a fetch of its title"
  scenario: "delivery/text.feature: Each network gets the same new short link"
- example: "Social::Operations::ExpandForNetwork makes no short link and fetches no title unless asked"
  scenario: "social/composer.feature: Counting a link elsewhere makes no short link"
- example: "Social::Operations::ExpandForNetwork reuses the short link it made before"
  scenario: "delivery/text.feature: Each network gets the same new short link"
- example: "Social::Operations::ExpandForNetwork tags the site's links with the network and counts other links at a short link's length"
  scenario: "social/composer.feature: The counters count typed text as the server does"
