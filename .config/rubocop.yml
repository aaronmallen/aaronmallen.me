plugins:
  - rubocop-capybara
  - rubocop-hanami
  - rubocop-i18n
  - rubocop-ordered_methods
  - rubocop-performance
  - rubocop-rspec

require:
  - ./rubocop/unused_deps.rb

inherit_mode:
  merge:
    - Include

AllCops:
  Include:
    - .config/Guardfile
    - .config/config.ru
    - .config/i18n/*.rb
    - .config/rubocop/*.rb
  NewCops: enable
  TargetRubyVersion: 4

Blog/UnusedDeps:
  Enabled: true
  AllowedNames:
    - act_on
    - contract
    - honeybadger
    - queries
    - record_link_queries
    - record_sync_outcome
    - thread_queries
  Include:
    - app/**/*.rb
    - slices/**/*.rb

Hanami/AppReferenceInSlice:
  Enabled: true

Hanami/ContainerLookup:
  Enabled: true

Hanami/ProviderTopLevelRequire:
  Exclude:
    - config/providers/db.rb

Hanami/SliceExports:
  ForbiddenExports:
    - !ruby/regexp /\A(?!(?:operations\.\w+|repos\.\w*queries|endpoints\.\w+|auth\.session_reader)\z)/

Hanami/SliceNamespace:
  Inflections:
    api: API
    mcp: MCP

Hanami/UnusedDeps:
  Enabled: false

Hanami/UnvalidatedParams:
  Enabled: false

I18n/GetText:
  Enabled: false

I18n/RailsI18n/DecorateString:
  Exclude:
    - config/db/seeds/**/*.rb

Layout/CaseIndentation:
  IndentOneStep: true

Metrics/AbcSize:
  CountRepeatedAttributes: false

Metrics/BlockLength:
  CountAsOne:
    - array
    - hash
    - heredoc
    - method_call
  AllowedMethods:
    - change
    - create_table
    - down
    - migration
    - up

Metrics/ClassLength:
  CountAsOne:
    - array
    - hash
    - heredoc
    - method_call
  Exclude:
    - config/settings.rb
    - slices/admin/config/routes.rb
    - slices/api/config/routes.rb

Metrics/MethodLength:
  CountAsOne:
    - array
    - hash
    - heredoc
    - method_call

Metrics/ModuleLength:
  CountAsOne:
    - array
    - hash
    - heredoc
    - method_call
  Exclude:
    - lib/blog/types.rb

Metrics/ParameterLists:
  CountKeywordArgs: false

Naming/ConstantName:
  Exclude:
    - lib/**/types.rb

RSpec/DescribeClass:
  IgnoredMetadata:
    type:
      - app
      - feature
      - migration
      - request
      - script

RSpec/ExampleLength:
  CountAsOne:
    - heredoc

RSpec/NestedGroups:
  AllowedGroups:
    - describe

RSpec/SpecFilePathFormat:
  CustomTransform:
    GitHub: github
    LinkedIn: linkedin
    OAuth: oauth
    OAuthClientRepo: oauth_client_repo
    OAuthCodeRepo: oauth_code_repo
    OAuthTokenRepo: oauth_token_repo

Style/Documentation:
  Enabled: false

Style/NumericPredicate:
  Exclude:
    - config/db/migrate/**/*.rb

Style/RescueModifier:
  Exclude:
    - spec/**/*.rb

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: diff_comma

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: diff_comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: diff_comma
