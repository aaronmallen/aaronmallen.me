plugins:
  - rubocop-capybara
  - rubocop-hanami
  - rubocop-i18n
  - rubocop-ordered_methods
  - rubocop-performance
  - rubocop-rspec

inherit_mode:
  merge:
    - Include

AllCops:
  Include:
    - .config/Guardfile
    - .config/config.ru
  NewCops: enable
  TargetRubyVersion: 4

Hanami/SliceExports:
  ForbiddenExports:
    - !ruby/regexp /\A(?!(?:operations\.\w+|repos\.\w*queries|endpoints\.\w+|auth\.session_reader|contracts\.visit_contract|github\.client|linear\.client|networks\.all|store\.client)\z)/
  Exclude:
    - slices/backups/config/slice.rb

I18n/GetText:
  Enabled: false

I18n/RailsI18n/DecorateString:
  Exclude:
    - config/db/seeds/**/*.rb

Layout/CaseIndentation:
  IndentOneStep: true

Metrics/AbcSize:
  CountRepeatedAttributes: false

Metrics/BlockLength:
  CountAsOne:
    - array
    - hash
    - heredoc
    - method_call
  AllowedMethods:
    - change
    - create_table
    - down
    - migration
    - up

Metrics/ClassLength:
  CountAsOne:
    - array
    - hash
    - heredoc
    - method_call
  Exclude:
    - slices/admin/config/routes.rb
    - slices/api/config/routes.rb

Metrics/MethodLength:
  CountAsOne:
    - array
    - hash
    - heredoc
    - method_call

Metrics/ModuleLength:
  CountAsOne:
    - array
    - hash
    - heredoc
    - method_call
  Exclude:
    - lib/blog/types.rb

Metrics/ParameterLists:
  CountKeywordArgs: false

Naming/ConstantName:
  Exclude:
    - lib/**/types.rb

RSpec/DescribeClass:
  IgnoredMetadata:
    type:
      - app
      - feature
      - migration
      - request
      - script

RSpec/ExampleLength:
  CountAsOne:
    - heredoc

RSpec/NestedGroups:
  AllowedGroups:
    - describe

RSpec/SpecFilePathFormat:
  CustomTransform:
    GitHub: github
    GitHubProvider: github_provider
    OAuth: oauth
    OAuthClientRepo: oauth_client_repo
    OAuthCodeRepo: oauth_code_repo
    OAuthTokenRepo: oauth_token_repo

Style/Documentation:
  Enabled: false

Style/NumericPredicate:
  Exclude:
    - config/db/migrate/**/*.rb

Style/RescueModifier:
  Exclude:
    - spec/**/*.rb

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: diff_comma

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: diff_comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: diff_comma
