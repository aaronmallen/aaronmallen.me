[daemons.assets]
mise = true
run = "mise run dev:assets"

[daemons.media-store]
mise = true
oneshot = true
run = "scripts/util/compose run --rm media-store-bucket"

[daemons.postgres]
mise = true
oneshot = true
run = "mise run db:start"

[daemons.redis]
mise = true
oneshot = true
run = "mise run redis:start"

[daemons.server]
depends = ["assets", "media-store", "postgres", "redis", "tailwind"]
mise = true
run = "mise run dev:server"

[daemons.tailwind]
mise = true
run = "mise run dev:tailwind"

[daemons.worker]
depends = ["media-store", "postgres", "redis"]
mise = true
run = "mise run dev:worker"
