[daemons.assets]
auto = ["start", "stop"]
mise = true
run = "mise run dev:assets"

[daemons.media-store]
auto = ["start"]
mise = true
oneshot = true
run = "scripts/util/compose run --rm media-store-bucket"

[daemons.postgres]
auto = ["start"]
mise = true
oneshot = true
run = "scripts/util/compose up --detach --wait postgres"

[daemons.redis]
auto = ["start"]
mise = true
oneshot = true
run = "scripts/util/compose up --detach --wait redis"

[daemons.server]
auto = ["start", "stop"]
depends = ["assets", "media-store", "postgres", "redis", "tailwind"]
mise = true
run = "mise run dev:server"

[daemons.tailwind]
auto = ["start", "stop"]
mise = true
run = "mise run dev:tailwind"

[daemons.worker]
auto = ["start", "stop"]
depends = ["media-store", "postgres", "redis"]
mise = true
run = "mise run dev:worker"
