en:
  ui:
    layouts:
      application:
        title: "Connect an app | %{owner}"
    views:
      authorizations:
        new:
          approve: "Approve"
          cancel: "Cancel"
          grants: "What it gets"
          heading: "Connect the app at %{host}?"
          heading_no_host: "Approve this app?"
          named: "It calls itself %{client}. Any app can pick that name."
          new_client: "This app has never connected before. It registered on %{time}."
          publish_warning: "You cannot take back a published post or a sent social post."
          returns: "It goes back to %{uri} either way."
          scopes:
            agents: "Read and change agent memory, artifacts and sessions: the facts that load into every agent's work, their history and reverts, the plans, specs and handoffs agents keep, and each run's record of what it loaded and wrote"
            delete: "Delete posts, social posts and any other record for good"
            health: "Read your health data: sleep, heart rate, HRV, steps and workouts, day by day beside your work"
            mail: "Read, mark, tag, snooze and delete your mail from every account, contact form messages included, and save drafts for you to send. It can never send mail itself"
            publish: "Publish posts, send social posts and make any change that shows in public: shares, public projects and their boards, published and scheduled posts, work history, approved webmentions and webmention settings"
            read: "Read everything the site keeps but your health data, mail and agent memory: posts, drafts and all, social posts, your journal, tasks, projects, analytics, settings and the whole activity feed, with every commit you have made, whole message and all, private and work repositories included"
            suggest: "Send you suggested edits to accept or reject"
            write: "Make any change the admin makes short of publishing, sending and deleting: write and edit drafts, and change any record the public cannot see"
          unnamed: "It gave no name."
        refused:
          back: "Go back to %{host}"
          error: "%{description} (%{error})."
          heading: "Request refused"
          message: "The app at %{host} sent a request this site cannot take."
          nothing: "Nothing was approved. The link tells the app why."
        rejected:
          heading: "Form expired"
          message: "Nothing was approved. Start the connection again."
