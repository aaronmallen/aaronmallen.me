        privacy:
          address:
            heading: "Your address"
            log: "The server's request log keeps no address either."
            use: "Your browser sends its IP address with every request. The analytics never store it. They use it to look up your country on the server, with no outside service, and to make the hashes below, then drop it."
          basis:
            body: "I want to know which posts people read, so I can decide what to write next. Under the GDPR that is a legitimate interest, and I keep no more than the question needs: no stored address, no tracking cookie and nothing that follows you to other sites."
            heading: "Why"
          cookies:
            admin: "Signing in to the admin sets a second cookie, but I am the only one who signs in."
            heading: "Cookies"
            theme: "The site sets one cookie, and only when you pick a light or dark theme. It holds that choice and lasts a year."
          errors:
            body: "When a page breaks, the site sends an error report to Honeybadger. It strips your address, your cookies and what you typed into the contact form first."
            heading: "Errors"
          feeds:
            body: "The site counts fetches of its Atom feeds on the server. Services such as Feedly say how many people follow a feed when they fetch it, and the site keeps that number for the day. Any other feed reader counts once a day by its daily hash."
            heading: "Feeds"
          hashes:
            heading: "Hashes"
            intro: "A hash mixes your address and the name and version your browser sends with a secret only the server knows, and turns them into a string of letters and numbers. Without the secret, nobody can turn it back into an address. Until a hash changes, the same visitor makes the same string, so I can count people without knowing who they are."
            items:
              day: "A daily hash changes at midnight, Central time, and counts visitors for the day. A second daily hash, made from your network alone, caps how many hits one network can send. Your network is your whole address on IPv4, and its first half on IPv6."
              month: "A monthly hash changes on the first of each month and counts readers for the month."
              post: "A per post hash counts each post's unique readers. It mixes in which post you read in place of a date, so it stays the same for that post and never matches you on another. It has a secret of its own, and it counts only in the 12 months after a post goes up."
          heading: "What I keep about your visit."
          kicker: "Privacy"
          lede: "No tracking cookies, no ads and no scripts from anyone else. Here is what the site does keep, why, and for how long."
          messages:
            body: "A message you send through the contact form keeps your email address, the subject and the text until I delete it. Beside it the site keeps a daily hash of your network, to cap how many messages one sender can send. A message I mark as spam goes 30 days later."
            heading: "Messages"
          requests:
            body: "To ask what I hold about you, or to have it deleted, write to me through the"
            closing: "."
            heading: "Questions and requests"
            link: "contact form"
          retention:
            heading: "How long it stays"
            items:
              events: "Visit records and the hashes in them: 90 days. If the nightly job fails, they wait for its next run."
              feeds: "Feed reader hashes: 90 days."
              posts: "Per post hashes: until the post turns 12 months old. A nightly job then saves the post's count and deletes its hashes."
              totals: "Daily and monthly totals, each post's reader count and the feed counts: for good. They hold numbers, not people."
          title: "Privacy"
          visits:
            heading: "What a visit records"
            intro: "When a page loads, a small script sends the site a record of the view, then a few updates as you read. The record holds:"
            items:
              clicks: "on a post, the site and page of each link you follow away from it, but never the part after a ? or #"
              country: "your country"
              device: "your kind of device: desktop, phone, tablet or the browser inside an app"
              hashes: "the daily, monthly and network hashes"
              page: "the page and its title"
              reading: "how long you read, up to 20 minutes, and how far you scrolled, in quarters"
              referrer: "the name of the site that sent you, or the page you came from on this one"
              source: "the ref tag on the link that brought you, such as ref=mastodon, if it has one"
            read_through: "A view that scrolls three quarters of the way down and stays 30 seconds counts as a read-through."
            script: "With JavaScript off, the script never runs and the analytics record nothing."
