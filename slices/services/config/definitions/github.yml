name: GitHub
icon: fa-brands fa-github
group: code
auth: [oauth, credentials]
dashboard: https://github.com/settings/applications
env:
  github: [client_id, client_secret]
fields: [access_token]
powers:
  - Issue import into external tasks
  - Commit record on Activity
  - Project stars and releases
scopes:
  - {id: repo, label: Read repositories and issues, why: "Issues, commits, project stats"}
  - {id: "read:org", label: Read organization membership, why: "Repos and issues you reach through an org"}
jobs:
  - {every: every 15 minutes, sync: issues}
  - {every: every 15 minutes, sync: commits}
  - {every: every 15 minutes, sync: pull_requests}
  - {every: nightly, sync: projects}
