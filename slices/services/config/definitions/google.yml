name: Google
icon: fa-brands fa-google
group: personal
auth: oauth
multiple: true
dashboard: https://myaccount.google.com/connections
env:
  google: [client_id, client_secret]
powers:
  - Gmail in Mail
  - Google Calendar events on the calendar
  - Sleep, heart rate and workouts beside each day's work
scopes:
  - id: "openid https://www.googleapis.com/auth/userinfo.email"
    label: See your address
    why: Which account mail and events come from
  - {id: "https://mail.google.com/", label: "Read, send, label and delete mail", why: Mail}
  - id: "https://www.googleapis.com/auth/calendar"
    label: See and edit calendars and events
    why: Events on the calendar
  - id: "https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly"
    label: Read workouts, steps and activity
    why: Workouts and zone minutes
  - {id: "https://www.googleapis.com/auth/googlehealth.sleep.readonly", label: Read sleep, why: Sleep on each day}
  - id: "https://www.googleapis.com/auth/googlehealth.health_metrics_and_measurements.readonly"
    label: Read heart rate and HRV
    why: Resting heart rate and HRV
jobs:
  - {name: Gmail sync, every: every 5 minutes, sync: mail}
  - {name: Google Calendar sync, every: every 15 minutes, sync: calendar}
  - {name: Google Health sync, every: every 15 minutes, sync: health}
